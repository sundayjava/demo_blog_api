[package]
name = "role-base-auth"
version = "0.1.0"
edition = "2024"
default-run = "role-base-auth"

[dependencies]
# Web Framework
actix-web = "4.11.0"
actix-cors = "0.7"
actix-multipart = "0.7.2"
actix-files = "0.6"
futures = "0.3.31"

# Async Runtime
tokio = { version = "1.48.0", features = ["full"] }

# Database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "migrate"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
argon2 = "0.5"
jsonwebtoken = { version = "10.0.0", features = ["rust_crypto"] }

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.2"
dotenv = "0.15"
config = "0.15.18"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Error Handling
thiserror = "2.0.17"
anyhow = "1.0"

[dev-dependencies]
actix-rt = "2.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1